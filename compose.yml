services:
  app:
    build: .
    image: dungeon-draft-converter
    container_name: dd-converter
    ports:
      - '${HOST_PORT:-3000}:3000'
    mem_limit: 4g
    restart: unless-stopped
    stop_grace_period: 330s
    read_only: true
    volumes:
      - uploads:/tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

volumes:
  uploads:
