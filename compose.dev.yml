services:
  postgres:
    ports:
      - '127.0.0.1:5432:5432'

  postgres-test:
    image: postgres:17
    container_name: dd-postgres-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U test -d test']
      interval: 2s
      timeout: 3s
      retries: 30
